name: Auto-Grading

on:
  push:
    branches:
      - main
      - master

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Leadership Check
        id: test
        run: |
          SCORE=0
          if [ -f "proposal.md" ]; then
            SCORE=$((SCORE + 50))
            WORDS=$(wc -w < proposal.md)
            if [ $WORDS -ge 150 ]; then
              SCORE=$((SCORE + 50))
              echo "Proposal meets requirements! (+50%)"
            else
              echo "proposal.md is too short ($WORDS words). (+0%)"
            fi
          else
            echo "proposal.md not found!"
          fi
          
          echo "Final Score: $SCORE%"
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          
          if [ $SCORE -lt 55 ]; then
            exit 1
          fi
          exit 0
        continue-on-error: true

      - name: Report Status to Academy Backend
        env:
          WEBHOOK_URL: "https://backend.aetechlabs.com/api/academy/webhooks/github"
        run: |
          OUTCOME="fail"
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            OUTCOME="pass"
          fi

          curl -X POST -H "Content-Type: application/json" \
               -d "{
                 \"repository\": \"${{ github.repository }}\",
                 \"username\": \"${{ github.actor }}\",
                 \"status\": \"$OUTCOME\",
                 \"score\": ${{ steps.test.outputs.score }},
                 \"commit\": \"${{ github.sha }}\"
               }" \
               $WEBHOOK_URL
